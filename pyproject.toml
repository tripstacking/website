[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripstacking-website"
version = "0.1.0"
description = "Trip Stacking Astro marketing site themes, Cloudflare Workers deployment, and comparison CLI."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "cyclopts>=3.0.0",
]

[project.scripts]
ts-website = "tripstacking_website.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.89",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"
